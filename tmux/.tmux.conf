# history
set-option -g history-limit 100000

# terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:Tc"
set -ga terminal-overrides ",xterm*:smcup@:rmcup@"

# prefix
unbind C-b
set -g prefix C-l
bind-key -n C-l send-prefix

# responsiveness
set -s escape-time 0
set -g repeat-time 250

# reload config
bind r source-file ~/.tmux.conf ; display-message "config reloaded"

# titles
set -g set-titles on
set -g set-titles-string "#T"

# indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# vi mode
set -g mode-keys vi
set -g mouse on

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# copy mode
bind y copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# split panes in current directory
bind / split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Base16 Gruvbox dark, hard
# Scheme author: Dawid Kurek (dawikur@gmail.com), morhetz (https://github.com/morhetz/gruvbox)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# status bar position
set -g status-position top

# status bar
set -g status-style "fg=#bdae93,bg=#3c3836"

# window list
setw -g window-status-style "fg=#928374,bg=#3c3836"
setw -g window-status-format " #I:#W "

# active window
setw -g window-status-current-style "fg=#fabd2f,bg=#3c3836,bold"
setw -g window-status-current-format " #I:#W* "

# pane borders
set -g pane-border-style "fg=#665c54"
set -g pane-active-border-style "fg=#fabd2f"

# copy mode
setw -g mode-style "fg=#ebdbb2,bg=#504945"

# messages
set -g message-style "fg=#d5c4a1,bg=#3c3836"

# pane number display
set -g display-panes-colour "#fabd2f"
set -g display-panes-active-colour "#b8bb26"

# clock
setw -g clock-mode-colour "#b8bb26"

# bell
setw -g window-status-bell-style "fg=#3c3836,bg=#fb4934"

# command prompt
set -g message-command-style "fg=#ebdbb2,bg=#504945"
