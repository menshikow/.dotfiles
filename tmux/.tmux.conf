set-option -g default-shell /opt/homebrew/bin/fish

# history
set-option -g history-limit 100000

# terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:Tc"
set -ga terminal-overrides ",xterm*:smcup@:rmcup@"

# prefix
unbind C-b
set -g prefix C-l
bind-key -n C-l send-prefix

# responsiveness
set -s escape-time 0
set -g repeat-time 250

# reload config
bind r source-file ~/.tmux.conf ; display-message "config reloaded"

# titles
set -g set-titles on
set -g set-titles-string "#T"

# indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# vi mode
set -g mode-keys vi
set -g mouse on

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# copy mode
bind y copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# open new windows and split panes in current directory
bind c new-window -c "#{pane_current_path}"
bind / split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

### COLOUR (Solarized 255)

##### Status bar #####

set -g status-style "fg=colour136,bg=colour235"

##### Window titles #####

set -g window-status-style "fg=colour244,bg=default"
set -g window-status-current-style "fg=colour166,bg=default"

##### Pane borders #####

set -g pane-border-style "fg=colour235"
set -g pane-active-border-style "fg=colour240"

##### Messages #####

set -g message-style "fg=colour166,bg=colour235"

##### Display panes #####

set -g display-panes-colour colour166
set -g display-panes-active-colour colour33

##### Clock #####

set -g clock-mode-colour colour64

##### Bell #####

set -g window-status-bell-style "fg=colour235,bg=colour160"
