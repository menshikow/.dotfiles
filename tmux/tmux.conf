# history
set-option -g history-limit 100000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:Tc"
# Let Ghostty handle scrollback (disable alt screen). Remove if you prefer tmux-only scrollback.
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'

# prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -s escape-time 0

# titles
set -g set-titles on
set -g set-titles-string "#T"
set -g base-index 1
set -g pane-base-index 1

# vi mods
set -g mode-keys vi
set -g mouse on

# Pane movement with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# paste on (Ctrl-s then Ctrl-c / Ctrl-v)
bind C-c copy-mode
bind C-v paste-buffer

# macOS clipboard
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# status bar
set -g status-right ''
set -g status-right-length 9

# Gruvbox-like styling
set-option -g status-style "fg=#bdae93,bg=#1c1816"
set-window-option -g window-status-style "fg=#bdae93,bg=default"
set-window-option -g window-status-current-style "fg=#fabd2f,bg=default"
set-option -g pane-border-style "fg=#3c3836"
set-option -g pane-active-border-style "fg=#504945"
set-option -g message-style "fg=#d5c4a1,bg=#3c3836"
set-option -g display-panes-active-colour "#b8bb26"
set-option -g display-panes-colour "#fabd2f"
set-window-option -g clock-mode-colour "#b8bb26"
set-window-option -g mode-style "fg=#bdae93,bg=#504945"
set-window-option -g window-status-bell-style "fg=#3c3836,bg=#fb4934"
