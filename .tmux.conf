set -g default-command /usr/bin/fish

# history
set-option -g history-limit 100000

# terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:Tc"
set -ga terminal-overrides ",xterm*:smcup@:rmcup@"

# prefix
unbind C-b
set -g prefix C-l
bind-key -n C-l send-prefix

# responsiveness
set -s escape-time 0
set -g repeat-time 250

# reload config
bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# titles
set -g set-titles on
set -g set-titles-string "#T"

# indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# disable bell
set -g bell-action none
set -g visual-bell off

# vi mode
set -g mode-keys vi
set -g mouse on

# paste from system clipboard with Ctrl+V (no shift)
bind -n C-v run "tmux set-buffer -- \"$(xclip -o -selection clipboard)\"; tmux paste-buffer"

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# copy mode
bind y copy-mode
set -g set-clipboard on

# copy to system clipboard (xclip for X11)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -se clipboard -i"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -se clipboard -i"

# pipe selection to the system clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -se clipboard -i"
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -se clipboard -i"

# open new windows and split panes in current directory
bind c new-window -c "#{pane_current_path}"
bind / split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

#### COLOURS ####
# base00 #20201d  bg (darkest)
# base01 #292824  bg (lighter, status bar bg)
# base02 #6e6b5e  selection / inactive borders
# base03 #7d7a68  comments / muted text
# base04 #999580  dark fg
# base05 #a6a28c  default fg
# base06 #e8e4cf  light fg
# base07 #fefbec  lightest
# base08 #d43552  red     - errors, bell
# base09 #b65611  orange  - inactive accent
# base0A #ae9513  yellow  - highlight
# base0B #60ac39  green   - ok / success
# base0C #1ead8f  cyan    - secondary accent / clock
# base0D #6684e1  blue    - active window / primary accent
# base0E #b854d4  purple  - message / prompt accent
# base0F #b46958  brown   - rarely used

# status bar
set-option -g status-style "bg=#292824,fg=#a6a28c"

# window titles
set-window-option -g window-status-style "fg=#7d7a68,bg=default"
set-window-option -g window-status-current-style "fg=#6684e1,bg=default,bold"
set-window-option -g window-status-activity-style "fg=#ae9513,bg=default"

# pane border
set-option -g pane-border-style "fg=#292824"
set-option -g pane-active-border-style "fg=#6684e1"

# message text
set-option -g message-style "bg=#292824,fg=#b854d4"
set-option -g message-command-style "bg=#292824,fg=#b854d4"

# pane number display
set-option -g display-panes-active-colour "#6684e1"
set-option -g display-panes-colour "#b65611"

# clock
set-window-option -g clock-mode-colour "#1ead8f"

# bell
set-window-option -g window-status-bell-style "fg=#292824,bg=#d43552,bold"

# copy mode selection
set-window-option -g mode-style "bg=#6e6b5e,fg=#e8e4cf"
